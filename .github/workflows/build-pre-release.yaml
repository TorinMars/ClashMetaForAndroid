name: Build Pre-Release
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  BuildPreRelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Test signing configuration
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Prepare signing settings
        id: signing
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: python3 .github/scripts/prepare_signing.py

      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'
          cache: false

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Pre-release Build
        if: success()
        run: ./gradlew --no-daemon app:assembleCaptureRelease

      - name: Upload test APKs
        uses: actions/upload-artifact@v7
        with:
          name: T-Agent Capture APKs
          path: app/build/outputs/apk/capture/release/*.apk
          if-no-files-found: error
          retention-days: 7

      # Delete old Prerelease-capture
      - uses: dev-drprasad/delete-tag-and-release@v1.1
        if: steps.signing.outputs.configured == 'true'
        with:
          tag_name: Prerelease-capture
          github_token: ${{ secrets.GITHUB_TOKEN }}
          delete_release: true

      - name: Tag Repo
        if: steps.signing.outputs.configured == 'true'
        uses: richardsimko/update-tag@v3
        with:
          tag_name: Prerelease-capture
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Capture
        uses: softprops/action-gh-release@v3
        if: success() && steps.signing.outputs.configured == 'true'
        with:
          tag_name: Prerelease-capture
          files: app/build/outputs/apk/capture/release/*
          prerelease: true
          generate_release_notes: true

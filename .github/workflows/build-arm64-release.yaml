name: Build arm64 APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, e.g. v1.2.3"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: arm64-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and Mihomo submodule
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set release metadata
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          TAG="$RELEASE_TAG"
          VERSION_NAME="${TAG#v}"
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a tag in vMAJOR.MINOR.PATCH format; received: $TAG" >&2
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          VERSION_CODE=$((10#$MAJOR * 100000 + 10#$MINOR * 1000 + 10#$PATCH))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          go-version: "1.26"

      - name: Apply Go compatibility patches
        shell: bash
        run: |
          cd "$(go env GOROOT)"
          for patch_file in "$GITHUB_WORKSPACE"/.github/patch/*.patch; do
            patch --batch --forward -p 1 < "$patch_file"
          done

      - name: Update CA bundle used by Mihomo
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates
          sudo update-ca-certificates
          cp /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Configure all four SIGNING_* secrets using the same private key as your installed APK." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > downstream.keystore
          {
            echo "keystore.password=$KEYSTORE_PASSWORD"
            echo "key.alias=$KEY_ALIAS"
            echo "key.password=$KEY_PASSWORD"
          } > signing.properties

      - name: Build Meta arm64-v8a release APK
        run: >-
          ./gradlew --no-daemon app:assembleMetaRelease
          -Papp.version.name=${{ steps.release.outputs.version_name }}
          -Papp.version.code=${{ steps.release.outputs.version_code }}
          -Ptarget.abis=arm64-v8a
          -Pcustom.keystore.file=downstream.keystore

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmfa-${{ steps.release.outputs.tag }}-arm64-v8a
          path: app/build/outputs/apk/meta/release/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: app/build/outputs/apk/meta/release/*arm64-v8a*.apk
